apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique-dev
resources:
  - ../../base
  - namespace.yaml
labels:
  - pairs:
      environment: dev
    includeSelectors: false
    includeTemplates: true
replicas:
  - name: frontend
    count: 1
  - name: loadgenerator
    count: 1

images:
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/frontend
    newName: kiratech-frontend
    newTag: v1
