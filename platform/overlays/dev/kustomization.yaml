apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique-dev
resources:
  - ../../base
  - namespace.yaml
labels:
  - pairs:
      environment: dev
    includeSelectors: false
    includeTemplates: true
replicas:
  - name: frontend
    count: 1
  - name: loadgenerator
    count: 1
