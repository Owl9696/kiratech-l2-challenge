deployment:
  replicas: 1

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik

providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: false
  kubernetesGateway:
    enabled: false

gateway:
  enabled: false

ingressRoute:
  dashboard:
    enabled: false

service:
  spec:
    type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
